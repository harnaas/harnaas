# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: harnaas
    main: ./cmd/harnaas
    binary: harnaas
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # These stamps are what make `harnaas --version` report a release
      # version; an unstamped build falls back to the embedded build info.
      - -X github.com/harnaas/harnaas/cmd/harnaas/cli/versioninfo.Version={{.Version}}
      - -X github.com/harnaas/harnaas/cmd/harnaas/cli/versioninfo.Commit={{.ShortCommit}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # A tag carrying a pre-release suffix — v1.0.0-rc.1 — is published as a
  # GitHub pre-release without anybody having to remember a flag, and does not
  # become the "latest" release a bare download URL resolves to. The two
  # package managers below key off the same distinction.
  prerelease: auto
  make_latest: true
  # What makes re-running a failed release for the same tag actually work.
  #
  # The two package managers are published after the GitHub release, because the
  # cask and the manifest need its download URLs. So the run that fails while
  # pushing a tap has already uploaded every archive — and a re-run without this
  # meets 422 already_exists on the first of them and dies there, never reaching
  # the tap it was re-run to fix. The recovery documented in docs/RELEASING.md
  # would be a recovery that cannot be performed.
  #
  # It is scoped to exactly that: an upload is retried only after a 422, by
  # deleting the asset of the same name and uploading again, so a release that
  # uploads cleanly the first time is unaffected.
  replace_existing_artifacts: true

# The two package managers harnaas is distributed through. Each publishes into
# its own repository under the same organization, which the workflow's own
# GITHUB_TOKEN cannot reach: it is scoped to the repository the workflow runs
# in, and neither of these pushes lands there.
#
# Each tap is pushed over SSH with a deploy key of its own rather than with one
# shared token, which is two properties rather than one. A deploy key is scoped
# to a single repository, so the credential that writes the cask cannot write
# the bucket and vice versa — a token granting Contents: write on both would
# have no such seam. And a deploy key does not expire, where a token does: the
# release that first met an expired one would be the release that published the
# archives and silently left both package managers on the previous version,
# which is the failure this file is arranged to make impossible.
#
# The keys are read from the environment rather than named as secrets here,
# because .goreleaser.yaml is also run locally — a developer checking the
# config with `goreleaser check` or building a snapshot must not need one.
#
# `envOrDefault` rather than a bare `.Env` lookup is load-bearing, and is the
# one way this differs from the token it replaced. A token was resolved when
# the tap was pushed, which a snapshot never does; a git `private_key` is
# resolved when the cask is *written*, which a snapshot does every time. So
# `{{ .Env.… }}` fails a credential-free `--snapshot` with "map has no entry
# for key", and defaulting to empty is what keeps the local build working.
# Nothing reaches a publish holding an empty key, because mise-tasks/release
# refuses for a missing one before goreleaser is started at all.

# A cask rather than a formula. `brews` is formally deprecated as of GoReleaser
# v2.16 and fails `goreleaser check`: a formula that only unpacks a pre-compiled
# binary was a workaround for Homebrew having no other way to ship one, and it
# no longer is. A cask is what Homebrew wants for a released binary today.
homebrew_casks:
  - name: harnaas
    repository:
      owner: harnaas
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:harnaas/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    # Homebrew reads Casks/ in a tap. It is also the default, and stating it
    # keeps the layout readable from this file rather than from the docs.
    directory: Casks
    homepage: https://github.com/harnaas/harnaas
    description: Manage a project's AI-harness assets as a declared, versioned dependency
    # A pre-release must never become what `brew install harnaas` resolves to:
    # "auto" skips the cask update for exactly the tags `release.prerelease`
    # above marks, so the two cannot disagree.
    skip_upload: auto
    hooks:
      post:
        # macOS quarantines anything downloaded by a program, and the binary is
        # not signed by an identified developer, so without this the first run
        # is refused by Gatekeeper with a message about an unverified developer
        # rather than anything a user can act on. The guard is what lets the
        # same cask install on Linux, where the attribute does not exist.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/harnaas"]
          end

scoops:
  - name: harnaas
    repository:
      owner: harnaas
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:harnaas/scoop-bucket.git
        private_key: '{{ envOrDefault "SCOOP_BUCKET_DEPLOY_KEY" "" }}'
    # Scoop reads a bucket/ directory when one exists and the repository root
    # otherwise; committing to the directory now avoids a move later.
    directory: bucket
    homepage: https://github.com/harnaas/harnaas
    description: Manage a project's AI-harness assets as a declared, versioned dependency
    skip_upload: auto
