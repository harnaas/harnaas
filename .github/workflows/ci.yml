name: CI

# Every action below is pinned to a commit SHA with the tag in a trailing
# comment: a tag is mutable, and a mutable third-party action runs with this
# repository's token.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track go.mod so a Go bump does not need a parallel workflow edit.
          go-version-file: go.mod
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Run linters
        run: mise run lint
      # Same config as `mise run lint:go`, run through the action so findings
      # appear as inline annotations on the pull request.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: 'v2.11.3'

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Check dependency licenses
        run: mise run lint:licenses

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Run tests
        run: mise run test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Plain `go test` rather than the mise task: the tasks are /bin/sh
      # scripts, and this job exists to prove the Go code itself is
      # cross-platform.
      - name: Run tests
        run: go test ./...

  # Single required status check. Branch protection points at this job alone,
  # so adding a job above never needs a protection-rule edit.
  ci:
    runs-on: ubuntu-latest
    needs:
      - lint
      - licenses
      - test
      - test-windows
    if: ${{ always() }}
    steps:
      - name: Check dependencies
        run: |
          [ "${{ needs.lint.result }}" = "success" ]
          [ "${{ needs.licenses.result }}" = "success" ]
          [ "${{ needs.test.result }}" = "success" ]
          [ "${{ needs.test-windows.result }}" = "success" ]
